AWSTemplateFormatVersion: '2010-09-09'
Description: Grafana alert Lambda with HTTP API webhook, IAM role, CloudWatch logs, and optional Bedrock enrichment (Bedrock settings come from Secrets Manager).

Parameters:
  SecretName:
    Type: String
    Default: grafana-alert/env
    Description: Secrets Manager secret name used by the Lambda (includes Loki/Slack and optional Bedrock keys).

  FunctionName:
    Type: String
    Default: grafana-alert-lambda
    Description: Lambda function name.

  RoutePath:
    Type: String
    Default: /grafana/webhook
    Description: HTTP API route path for Grafana webhooks.

  LambdaTimeout:
    Type: Number
    Default: 120
    Description: >-
      Lambda timeout in seconds. Shared by the alert and weekly-report paths. The report
      fans out DynamoDB queries across several weeks and then calls Bedrock, so this must
      comfortably exceed REPORT_BEDROCK_TIMEOUT_MS. The alert path is unaffected: a Lambda
      is billed for time used, not for the timeout ceiling.

  LambdaMemorySize:
    Type: Number
    Default: 256
    Description: Lambda memory size in MB.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - staging
      - prod
    Description: Deployment environment. Used for the Project tag (grafana-alert-<environment>).

  HistoryTableName:
    Type: String
    Default: ''
    Description: >-
      DynamoDB table storing processed alerts. Leave empty to derive it as
      grafana-alert-history-<environment>. DynamoDB table names are unique per account and
      region, so a fixed name across environments would make the second stack fail to create.
      Copy the resolved value into HISTORY_TABLE_NAME in that environment's secret.

  ReportScheduleExpression:
    Type: String
    Default: cron(0 8 ? * MON *)
    Description: >-
      When the weekly report runs, in ReportScheduleTimezone. Defaults to Monday 08:00,
      which reports the week that closed the previous night.

  ReportScheduleTimezone:
    Type: String
    Default: America/Bogota
    Description: >-
      IANA timezone for the schedule. EventBridge Scheduler is timezone-aware, unlike
      EventBridge Rules, so the run time does not drift with daylight saving. Keep this
      aligned with LOG_TIMEZONE in the secret, which is what the report weeks are cut on.

  ReportScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: >-
      Deliberately DISABLED by default. The report needs two or three weeks of stored
      alerts before its recurring-versus-new classification says anything useful; enable
      it once {"diagnostic":"report"} shows the grouping is right.

Conditions:
  HasExplicitHistoryTableName: !Not [!Equals [!Ref HistoryTableName, '']]

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: grafana-alert-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Sid: ReadAlertingSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*'
              - Sid: InvokeBedrockModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Converse
                Resource:
                  # Model ID is chosen at runtime from Secrets Manager; scope to foundation models in this region.
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
              - Sid: WriteAlertHistory
                Effect: Allow
                Action:
                  # Query is needed immediately by the {"diagnostic":"history"} branch.
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt AlertHistoryTable.Arn
      Tags:
        - Key: Project
          Value: !Sub 'grafana-alert-${Environment}'

  AlertHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If
        - HasExplicitHistoryTableName
        - !Ref HistoryTableName
        - !Sub 'grafana-alert-history-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        # pk is DAY#<yyyy-mm-dd>: a weekly report is 7 Query calls, "last N days"
        # works for any N, and no partition grows without bound.
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Sub 'grafana-alert-${Environment}'

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Sub 'grafana-alert-${Environment}'

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaLogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Description: Receives Grafana alerts, queries Loki, optionally enriches with Bedrock (config from secret), and notifies Slack.
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Environment:
        Variables:
          ALERTING_SECRET_NAME: !Ref SecretName
      Tags:
        - Key: Project
          Value: !Sub 'grafana-alert-${Environment}'
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'Application code not deployed yet. Run npm run deploy.',
            }),
          });

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${FunctionName}-api'
      ProtocolType: HTTP
      Tags:
        Project: !Sub 'grafana-alert-${Environment}'

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: !Sub 'POST ${RoutePath}'
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      Tags:
        Project: !Sub 'grafana-alert-${Environment}'

  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

  # EventBridge Scheduler assumes a role rather than using the function's resource
  # policy, so unlike API Gateway above it needs no AWS::Lambda::Permission.
  ReportSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # Confused-deputy guard: without it, a schedule in any other account
                # could ask Scheduler to assume this role.
                aws:SourceAccount: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: grafana-alert-report-scheduler-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeReportLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LambdaFunction.Arn
      Tags:
        - Key: Project
          Value: !Sub 'grafana-alert-${Environment}'

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${FunctionName}-weekly-report'
      Description: Invokes the Lambda to build and post the weekly recurring-pattern report.
      State: !Ref ReportScheduleState
      ScheduleExpression: !Ref ReportScheduleExpression
      ScheduleExpressionTimezone: !Ref ReportScheduleTimezone
      FlexibleTimeWindow:
        # A weekly digest has no reason to jitter, and an exact time makes it obvious
        # when a run did not happen.
        Mode: 'OFF'
      Target:
        Arn: !GetAtt LambdaFunction.Arn
        RoleArn: !GetAtt ReportSchedulerRole.Arn
        # The payload is the whole event: the handler normalizes this shape alongside
        # the API Gateway one.
        Input: '{"report":"weekly"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

Outputs:
  WebhookUrl:
    Description: Grafana Alertmanager webhook URL.
    Value: !Join
      - ''
      - - !GetAtt HttpApi.ApiEndpoint
        - !Ref RoutePath

  LambdaFunctionName:
    Description: Deployed Lambda function name.
    Value: !Ref LambdaFunction

  LambdaFunctionArn:
    Description: Deployed Lambda function ARN.
    Value: !GetAtt LambdaFunction.Arn

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN.
    Value: !GetAtt LambdaExecutionRole.Arn

  SecretName:
    Description: Secrets Manager secret name configured in the Lambda.
    Value: !Ref SecretName

  HistoryTableName:
    Description: DynamoDB alert-history table. Copy into HISTORY_TABLE_NAME in the secret.
    Value: !Ref AlertHistoryTable

  WeeklyReportScheduleName:
    Description: EventBridge schedule that triggers the weekly report.
    Value: !Ref WeeklyReportSchedule

  WeeklyReportScheduleState:
    Description: Whether the weekly report schedule is currently armed.
    Value: !Ref ReportScheduleState

  ProjectTag:
    Description: Project tag applied to stack resources.
    Value: !Sub 'grafana-alert-${Environment}'

  Environment:
    Description: Deployment environment used for the Project tag.
    Value: !Ref Environment
