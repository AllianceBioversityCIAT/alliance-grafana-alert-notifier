AWSTemplateFormatVersion: '2010-09-09'
Description: Grafana alert Lambda with HTTP API webhook, IAM role, and CloudWatch logs.

Parameters:
  SecretName:
    Type: String
    Default: grafana-alert/env
    Description: Secrets Manager secret name used by the Lambda.

  FunctionName:
    Type: String
    Default: grafana-alert-lambda
    Description: Lambda function name.

  RoutePath:
    Type: String
    Default: /grafana/webhook
    Description: HTTP API route path for Grafana webhooks.

  LambdaTimeout:
    Type: Number
    Default: 30
    Description: Lambda timeout in seconds.

  LambdaMemorySize:
    Type: Number
    Default: 256
    Description: Lambda memory size in MB.

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: grafana-alert-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Sid: ReadAlertingSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*'

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}'
      RetentionInDays: 14

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaLogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Description: Receives Grafana alerts, queries Loki, and sends Slack notifications.
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Environment:
        Variables:
          ALERTING_SECRET_NAME: !Ref SecretName
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'Application code not deployed yet. Run npm run deploy.',
            }),
          });

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${FunctionName}-api'
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: !Sub 'POST ${RoutePath}'
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

Outputs:
  WebhookUrl:
    Description: Grafana Alertmanager webhook URL.
    Value: !Join
      - ''
      - - !GetAtt HttpApi.ApiEndpoint
        - !Ref RoutePath

  LambdaFunctionName:
    Description: Deployed Lambda function name.
    Value: !Ref LambdaFunction

  LambdaFunctionArn:
    Description: Deployed Lambda function ARN.
    Value: !GetAtt LambdaFunction.Arn

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN.
    Value: !GetAtt LambdaExecutionRole.Arn

  SecretName:
    Description: Secrets Manager secret name configured in the Lambda.
    Value: !Ref SecretName
